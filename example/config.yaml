issuer: http://dex.127.0.0.1.nip.io:5556/dex
storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db
web:
  http: 0.0.0.0:5556
  allowedOrigins: ['*']
staticClients:
  - id: feathers-spa-client
    redirectURIs:
      - 'https://oidcdebugger.com/debug'
      - 'http://localhost:8000'
    name: 'Feathers App'
    public: true
enablePasswordDB: true
staticPasswords:
- email: "admin@example.com"
  # bcrypt hash of the string "password": $(echo password | htpasswd -BinC 10 admin | cut -d: -f2)
  hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
  username: "admin"
  name: "Admin User"
  emailVerified: true
  preferredUsername: "admin"
  groups:
  - "team-a"
  - "team-a/admins"
  userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"

# Configuration for signing JWT tokens.
# - "local": use local keys (supports RS256 (default) and ES256)
# - "vault": use Vault Transit backend (supports RSA, ECDSA, and Ed25519)
signer:
  type: local
  config:
    keysRotationPeriod: "6h"
    algorithm: "RS256" # changes apply on the next key rotation